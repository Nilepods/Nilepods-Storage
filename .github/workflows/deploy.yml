# Builds the site and uploads it to Hostinger over SSH on every push to main.
#
# Repository SECRET (Settings -> Secrets and variables -> Actions -> Secrets):
#   HOSTINGER_SSH_KEY        private half of the deploy key (public half is in hPanel -> Advanced -> SSH Access)
#
# Repository VARIABLES (same page -> Variables tab; these are not secret):
#   HOSTINGER_SSH_HOST       server IP from hPanel -> Advanced -> SSH Access
#   HOSTINGER_SSH_PORT       SSH port from the same page (65002 on Hostinger web hosting)
#   HOSTINGER_SSH_USER       SSH username from the same page (u123456789)
#   HOSTINGER_KNOWN_HOSTS    the server's SSH host keys, so the workflow only talks to the real server
#   HOSTINGER_REMOTE_DIR     folder the site is served from, relative to the home folder,
#                            e.g. domains/nilepods.com/public_html/preview
#   VITE_SUPABASE_URL        Supabase project URL
#   VITE_SUPABASE_ANON_KEY   Supabase publishable key (public by design; never the secret/service_role key)

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Check deploy settings
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          USER: ${{ vars.HOSTINGER_SSH_USER }}
          KNOWN: ${{ vars.HOSTINGER_KNOWN_HOSTS }}
          DIR: ${{ vars.HOSTINGER_REMOTE_DIR }}
        run: |
          missing=""
          [ -n "$KEY" ]   || missing="$missing HOSTINGER_SSH_KEY(secret)"
          [ -n "$HOST" ]  || missing="$missing HOSTINGER_SSH_HOST"
          [ -n "$USER" ]  || missing="$missing HOSTINGER_SSH_USER"
          [ -n "$KNOWN" ] || missing="$missing HOSTINGER_KNOWN_HOSTS"
          [ -n "$DIR" ]   || missing="$missing HOSTINGER_REMOTE_DIR"
          if [ -n "$missing" ]; then
            echo "::error::Hostinger deploy settings missing:$missing. Add them in GitHub repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Upload to Hostinger
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          PORT: ${{ vars.HOSTINGER_SSH_PORT || '65002' }}
          USER: ${{ vars.HOSTINGER_SSH_USER }}
          KNOWN: ${{ vars.HOSTINGER_KNOWN_HOSTS }}
          DIR: ${{ vars.HOSTINGER_REMOTE_DIR }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          SSH="ssh -p $PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ConnectTimeout=30"
          # The host sometimes drops the first connection attempt, so retry a few times.
          for i in 1 2 3 4; do
            $SSH "$USER@$HOST" "mkdir -p '$DIR'" && break
            [ "$i" = 4 ] && { echo "::error::Could not connect to Hostinger over SSH"; exit 1; }
            echo "SSH attempt $i failed, retrying in 10s"; sleep 10
          done
          # No --delete: files already on the server that are not part of this build are left alone.
          for i in 1 2 3; do
            rsync -rlvz --checksum -e "$SSH" dist/ "$USER@$HOST:$DIR/" && exit 0
            echo "Upload attempt $i failed, retrying in 10s"; sleep 10
          done
          echo "::error::Upload to Hostinger failed"; exit 1

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
